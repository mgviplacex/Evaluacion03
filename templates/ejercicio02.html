<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Contador de Largo de Nombres</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container container-center">
        <form method="POST">
            <div class="form-group">
                <label for="nombre1" class="label-normal">Nombre 1:</label>
                <input type="text" name="nombre1" required>
            </div>
            <div class="form-group">
                <label for="nombre2" class="label-normal">Nombre 2:</label>
                <input type="text" name="nombre2" required>
            </div>
            <div class="form-group">
                <label for="nombre3" class="label-normal">Nombre 3:</label>
                <input type="text" name="nombre3" required>
            </div>
            <input type="submit" value="Enviar">
        </form>

        {% if nombre_mayor %}
        <div class="resultado-serif">
            <p>El nombre con mayor cantidad de caracteres es : {{ nombre_mayor }}</p>
            <p>El nombre tiene : {{ cantidad }} caracteres</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
